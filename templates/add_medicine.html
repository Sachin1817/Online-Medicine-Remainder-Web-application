{% extends "base.html" %}

{% block title %}Add Medicine - Medicine Reminder System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-prescription-bottle-medical"></i> Add New Medicine</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label"><i class="fas fa-prescription-bottle"></i> Medicine Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Paracetamol, Lipitor" required>
                    </div>
                    <div class="mb-3">
                        <label for="dosage" class="form-label"><i class="fas fa-weight-hanging"></i> Dosage</label>
                        <input type="text" class="form-control" id="dosage" name="dosage" placeholder="e.g., 1 tablet, 5ml, 500mg" required>
                    </div>
                    <div class="mb-3">
                        <label for="frequency" class="form-label"><i class="fas fa-calendar-alt"></i> Frequency</label>
                        <select class="form-control" id="frequency" name="frequency" required>
                            <option value="">Select frequency</option>
                            <option value="Once daily">Once daily</option>
                            <option value="Twice daily">Twice daily</option>
                            <option value="Three times daily">Three times daily</option>
                            <option value="Four times daily">Four times daily</option>
                            <option value="As needed">As needed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="times" class="form-label"><i class="fas fa-clock"></i> Reminder Times</label>
                        <div id="time-container">
                            <div class="input-group mb-2">
                                <input type="time" class="form-control time-input" name="times" required>
                                <button type="button" class="btn btn-outline-danger remove-time" style="display: none;"><i class="fas fa-trash-alt"></i> Remove</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-sm mt-1" id="add-time"><i class="fas fa-plus"></i> Add Time</button>
                        <div class="form-text text-muted mt-2">Add reminder times for this medicine dosage</div>
                    </div>
                    <div class="mb-3">
                        <label for="duration" class="form-label"><i class="fas fa-hourglass-half"></i> Duration (days)</label>
                        <input type="number" class="form-control" id="duration" name="duration" min="1" placeholder="e.g., 7, 30" required>
                    </div>
                    <div class="mb-3">
                        <label for="start_date" class="form-label"><i class="fas fa-calendar-day"></i> Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" required>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary btn-pulse me-2"><i class="fas fa-plus-circle"></i> Add Medicine</button>
                        <a href="{{ url_for('medicines.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
