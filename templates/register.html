{% extends "base.html" %}

{% block title %}Register - Medicine Reminder System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card fade-in-up p-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x mb-3" style="background: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;"></i>
                    <h2 class="fw-bold mb-1" style="background: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Outfit';">Register</h2>
                    <p class="text-muted small">Create an account to start scheduling reminders.</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label"><i class="fas fa-user"></i> Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Create a username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-pulse w-100 py-2">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                <p class="mt-4 text-center text-muted small">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-custom-link">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
